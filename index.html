<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2f9e6e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Habits">
<title>Habit Tracker</title>
<style>
  :root {
    --bg: #f6f5f1; --card: #ffffff; --text: #1f2328; --muted: #6b7280;
    --line: #e5e3dc; --accent: #2f9e6e; --accent-soft: #d9f2e6;
    --miss: #f3c9c4; --miss-text: #9a3b32; --pending: #ecebe6; --danger: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151719; --card: #1f2326; --text: #e8eaed; --muted: #9aa0a6;
      --line: #2e3337; --accent: #3dbb86; --accent-soft: #1d3a2e;
      --miss: #4a2a27; --miss-text: #f0a8a0; --pending: #2a2e31; --danger: #e5574a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.4;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px 60px; }
  header { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  h1 { font-size: 1.4rem; margin: 0; }
  .date { color: var(--muted); font-size: .95rem; text-transform: capitalize; }
  nav { display: flex; gap: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px; margin-bottom: 18px; }
  nav button {
    flex: 1; border: 0; background: transparent; color: var(--muted); font: inherit; font-weight: 600;
    padding: 10px; border-radius: 9px; cursor: pointer;
  }
  nav button.active { background: var(--accent); color: #fff; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 8px 16px; margin-bottom: 16px; }
  .progress { color: var(--muted); font-size: .9rem; margin: 0 0 10px; }
  .bar { height: 8px; background: var(--pending); border-radius: 99px; overflow: hidden; margin-bottom: 14px; }
  .bar > div { height: 100%; background: var(--accent); width: 0; transition: width .25s; }

  .habit { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .habit:last-child { border-bottom: 0; }
  .habit .name { flex: 1; font-size: 1.05rem; word-break: break-word; }
  .habit.done .name { color: var(--muted); text-decoration: line-through; }
  .switch {
    position: relative; width: 52px; height: 30px; border-radius: 99px; border: 0; cursor: pointer;
    background: var(--pending); transition: background .2s; flex-shrink: 0;
  }
  .switch::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .2s;
  }
  .switch[aria-checked="true"] { background: var(--accent); }
  .switch[aria-checked="true"]::after { transform: translateX(22px); }
  .remove { border: 0; background: transparent; color: var(--muted); font-size: 1.3rem; cursor: pointer; padding: 4px 8px; border-radius: 8px; }
  .remove:hover { color: var(--danger); background: var(--pending); }

  .add { display: flex; gap: 8px; margin-bottom: 8px; }
  .add input {
    flex: 1; font: inherit; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); color: var(--text);
  }
  .add button, .btn {
    font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 11px 16px; cursor: pointer;
    background: var(--accent); color: #fff;
  }
  .btn.secondary { background: var(--pending); color: var(--text); }
  .hint { color: var(--muted); font-size: .85rem; margin: 6px 0 14px; }
  .empty { color: var(--muted); padding: 18px 0; text-align: center; }

  .range { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .range button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--text); padding: 7px 12px; border-radius: 99px; cursor: pointer; }
  .range button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .hcard { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 14px; }
  .hcard h3 { margin: 0 0 4px; font-size: 1.05rem; word-break: break-word; }
  .hcard .removed { font-weight: 400; color: var(--muted); font-size: .8rem; }
  .stats { display: flex; gap: 16px; flex-wrap: wrap; color: var(--muted); font-size: .88rem; margin-bottom: 10px; }
  .stats b { color: var(--text); }
  .month { font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 8px 0 4px; }
  .days { display: flex; flex-wrap: wrap; gap: 4px; }
  .cell {
    width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center;
    font-size: .72rem; background: var(--pending); color: var(--muted);
  }
  .cell.yes { background: var(--accent); color: #fff; font-weight: 700; }
  .cell.no { background: var(--miss); color: var(--miss-text); }
  .cell.today { outline: 2px solid var(--text); outline-offset: 1px; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); margin: 0 0 14px; }
  .legend span::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 4px; margin-right: 5px; vertical-align: -1px; }
  .legend .l-yes::before { background: var(--accent); }
  .legend .l-no::before { background: var(--miss); }
  .legend .l-pend::before { background: var(--pending); }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Habit Tracker</h1>
    <div class="date" id="dateLabel"></div>
  </header>

  <nav>
    <button id="tabToday" class="active">Oggi</button>
    <button id="tabStats">Andamento</button>
  </nav>

  <!-- SCHERMATA OGGI -->
  <section id="viewToday">
    <div class="card">
      <p class="progress" id="progressText"></p>
      <div class="bar"><div id="progressBar"></div></div>
      <div id="todayList"></div>
    </div>

    <form class="add" id="addForm">
      <input id="newHabit" type="text" maxlength="60" placeholder="Nuova abitudine…" autocomplete="off">
      <button type="submit">Aggiungi</button>
    </form>
    <p class="hint">Le modifiche valgono da oggi in poi: lo storico dei giorni passati non cambia.</p>

    <div class="tools">
      <button class="btn secondary" id="exportBtn" type="button">Esporta backup</button>
      <button class="btn secondary" id="importBtn" type="button">Importa backup</button>
      <input type="file" id="importFile" accept="application/json" class="hidden">
    </div>
  </section>

  <!-- SCHERMATA ANDAMENTO -->
  <section id="viewStats" class="hidden">
    <div class="range" id="rangeBtns">
      <button data-days="30" class="active">30 giorni</button>
      <button data-days="90">90 giorni</button>
      <button data-days="0">Tutto</button>
    </div>
    <div class="legend">
      <span class="l-yes">Fatta</span>
      <span class="l-no">Non fatta</span>
      <span class="l-pend">Oggi / da fare</span>
    </div>
    <div id="statsList"></div>
  </section>
</div>

<script>
(function () {
  const KEY = 'habitTracker.v1';

  // ---------- Dati ----------
  // habits: [{id, name, start: 'YYYY-MM-DD', end: 'YYYY-MM-DD' | null}]
  //   attiva nei giorni d con start <= d < end (end esclusa)
  // log: { 'YYYY-MM-DD': { [habitId]: true } }
  let state = load();

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const s = JSON.parse(raw);
        if (s && Array.isArray(s.habits) && s.log) return s;
      }
    } catch (e) {}
    return { habits: [], log: {} };
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {
      alert('Impossibile salvare i dati in locale.');
    }
  }

  // ---------- Date (sempre in ora locale) ----------
  function ymd(d) {
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const g = String(d.getDate()).padStart(2, '0');
    return d.getFullYear() + '-' + m + '-' + g;
  }
  function parse(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
  function addDays(s, n) { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); }
  function todayStr() { return ymd(new Date()); }
  function isActive(h, d) { return h.start <= d && (!h.end || d < h.end); }
  function isDone(habit, d) { return !!(state.log[d] && state.log[d][habit.id]); }

  let currentDay = todayStr();
  let rangeDays = 30;

  // ---------- Schermata Oggi ----------
  function renderToday() {
    const today = currentDay;
    const label = parse(today).toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    document.getElementById('dateLabel').textContent = label;

    const list = document.getElementById('todayList');
    list.innerHTML = '';
    const active = state.habits.filter(h => isActive(h, today));

    if (!active.length) {
      const e = document.createElement('div');
      e.className = 'empty';
      e.textContent = 'Nessuna abitudine. Aggiungine una qui sotto.';
      list.appendChild(e);
    }

    let done = 0;
    active.forEach(h => {
      const isOn = isDone(h, today);
      if (isOn) done++;

      const row = document.createElement('div');
      row.className = 'habit' + (isOn ? ' done' : '');

      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = h.name;

      const sw = document.createElement('button');
      sw.className = 'switch';
      sw.type = 'button';
      sw.setAttribute('role', 'switch');
      sw.setAttribute('aria-checked', isOn ? 'true' : 'false');
      sw.setAttribute('aria-label', h.name);
      sw.addEventListener('click', () => toggle(h.id));

      const rm = document.createElement('button');
      rm.className = 'remove';
      rm.type = 'button';
      rm.title = 'Rimuovi da oggi in poi';
      rm.setAttribute('aria-label', 'Rimuovi ' + h.name);
      rm.textContent = '×';
      rm.addEventListener('click', () => removeHabit(h.id));

      row.append(sw, name, rm);
      list.appendChild(row);
    });

    document.getElementById('progressText').textContent =
      active.length ? done + ' di ' + active.length + ' completate oggi' : '';
    document.getElementById('progressBar').style.width =
      active.length ? (done / active.length * 100) + '%' : '0%';
  }

  function toggle(id) {
    const d = currentDay;
    if (!state.log[d]) state.log[d] = {};
    if (state.log[d][id]) delete state.log[d][id]; else state.log[d][id] = true;
    if (!Object.keys(state.log[d]).length) delete state.log[d];
    save();
    renderToday();
  }

  function addHabit(name) {
    name = name.trim();
    if (!name) return;
    state.habits.push({
      id: 'h' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      name: name, start: currentDay, end: null
    });
    save();
    renderToday();
  }

  function removeHabit(id) {
    const h = state.habits.find(x => x.id === id);
    if (!h) return;
    if (!confirm('Rimuovere "' + h.name + '"?\nDa oggi in poi non comparirà più; lo storico passato resta nell\'andamento.')) return;
    if (h.start >= currentDay) {
      // creata oggi e rimossa oggi: non ha mai avuto storico, la elimino del tutto
      state.habits = state.habits.filter(x => x.id !== id);
      Object.keys(state.log).forEach(d => {
        if (state.log[d][id]) delete state.log[d][id];
        if (!Object.keys(state.log[d]).length) delete state.log[d];
      });
    } else {
      h.end = currentDay;
    }
    save();
    renderToday();
  }

  // ---------- Schermata Andamento ----------
  function renderStats() {
    const today = currentDay;
    const box = document.getElementById('statsList');
    box.innerHTML = '';

    if (!state.habits.length) {
      const e = document.createElement('div');
      e.className = 'empty';
      e.textContent = 'Ancora nessuna abitudine da mostrare.';
      box.appendChild(e);
      return;
    }

    // abitudini attive prima, poi quelle rimosse
    const habits = state.habits.slice().sort((a, b) => {
      const ra = a.end ? 1 : 0, rb = b.end ? 1 : 0;
      return ra - rb || a.start.localeCompare(b.start);
    });

    const rangeStart = rangeDays ? addDays(today, -(rangeDays - 1)) : null;

    habits.forEach(h => {
      const lastDay = h.end ? addDays(h.end, -1) : today;
      const effLast = lastDay < today ? lastDay : today;
      if (effLast < h.start) return;

      // statistiche su tutta la vita dell'abitudine
      let total = 0, ok = 0;
      for (let d = h.start; d <= effLast; d = addDays(d, 1)) {
        const done = isDone(h, d);
        if (d < today || done) { total++; if (done) ok++; }
      }
      // serie in corso
      let streak = 0;
      let cursor = effLast;
      if (!h.end && !isDone(h, today)) cursor = addDays(today, -1);
      while (cursor >= h.start && isDone(h, cursor)) { streak++; cursor = addDays(cursor, -1); }

      const card = document.createElement('div');
      card.className = 'hcard';

      const title = document.createElement('h3');
      title.textContent = h.name;
      if (h.end) {
        const r = document.createElement('span');
        r.className = 'removed';
        r.textContent = '  · rimossa dal ' + parse(h.end).toLocaleDateString('it-IT');
        title.appendChild(r);
      }
      card.appendChild(title);

      const stats = document.createElement('div');
      stats.className = 'stats';
      const pct = total ? Math.round(ok / total * 100) : 0;
      stats.innerHTML =
        '<span><b>' + pct + '%</b> di giorni fatti</span>' +
        '<span><b>' + ok + '</b>/' + total + ' giorni</span>' +
        '<span>Serie: <b>' + streak + '</b></span>';
      card.appendChild(stats);

      // griglia giorni, raggruppata per mese
      const from = rangeStart && rangeStart > h.start ? rangeStart : h.start;
      let curMonth = '', daysBox = null;
      for (let d = from; d <= effLast; d = addDays(d, 1)) {
        const mk = d.slice(0, 7);
        if (mk !== curMonth) {
          curMonth = mk;
          const ml = document.createElement('div');
          ml.className = 'month';
          ml.textContent = parse(d).toLocaleDateString('it-IT', { month: 'long', year: 'numeric' });
          card.appendChild(ml);
          daysBox = document.createElement('div');
          daysBox.className = 'days';
          card.appendChild(daysBox);
        }
        const done = isDone(h, d);
        const c = document.createElement('div');
        c.className = 'cell' + (done ? ' yes' : (d < today ? ' no' : '')) + (d === today ? ' today' : '');
        c.textContent = parse(d).getDate();
        c.title = parse(d).toLocaleDateString('it-IT', { weekday: 'short', day: 'numeric', month: 'short' }) +
                  ' — ' + (done ? 'fatta' : (d < today ? 'non fatta' : 'da fare'));
        daysBox.appendChild(c);
      }
      box.appendChild(card);
    });
  }

  // ---------- Navigazione ----------
  const tabToday = document.getElementById('tabToday');
  const tabStats = document.getElementById('tabStats');
  const viewToday = document.getElementById('viewToday');
  const viewStats = document.getElementById('viewStats');

  function show(which) {
    const t = which === 'today';
    tabToday.classList.toggle('active', t);
    tabStats.classList.toggle('active', !t);
    viewToday.classList.toggle('hidden', !t);
    viewStats.classList.toggle('hidden', t);
    t ? renderToday() : renderStats();
  }
  tabToday.addEventListener('click', () => show('today'));
  tabStats.addEventListener('click', () => show('stats'));

  document.getElementById('rangeBtns').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    rangeDays = Number(b.dataset.days);
    document.querySelectorAll('#rangeBtns button').forEach(x => x.classList.toggle('active', x === b));
    renderStats();
  });

  document.getElementById('addForm').addEventListener('submit', e => {
    e.preventDefault();
    const inp = document.getElementById('newHabit');
    addHabit(inp.value);
    inp.value = '';
    inp.focus();
  });

  // ---------- Backup ----------
  document.getElementById('exportBtn').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'habit-tracker-backup-' + todayStr() + '.json';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });
  document.getElementById('importBtn').addEventListener('click', () => document.getElementById('importFile').click());
  document.getElementById('importFile').addEventListener('change', e => {
    const f = e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const s = JSON.parse(r.result);
        if (!s || !Array.isArray(s.habits) || typeof s.log !== 'object') throw 0;
        if (!confirm('Sostituire tutti i dati attuali con quelli del backup?')) return;
        state = s; save(); show('today');
      } catch (err) { alert('File di backup non valido.'); }
    };
    r.readAsText(f);
    e.target.value = '';
  });

  // ---------- Cambio giorno (reset a mezzanotte) ----------
  function checkNewDay() {
    const t = todayStr();
    if (t !== currentDay) {
      currentDay = t;
      show(viewToday.classList.contains('hidden') ? 'stats' : 'today');
    }
  }
  setInterval(checkNewDay, 30000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) checkNewDay(); });
  window.addEventListener('focus', checkNewDay);

  renderToday();
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
